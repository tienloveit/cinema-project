spring:
  config:
    import: 
      - optional:file:./backend/.env[.properties]
      - optional:file:./.env[.properties]

  application:
    name: backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinema2
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
  
server:
  port: 8081
  servlet:
    context-path: /api 


jwt: ${JWT_SECRET_KEY}